name: Build AndroidBackGesture V2.1 RootHide

on:
  workflow_dispatch:

 
    branches:
      - main
    paths:
      - "Makefile"
      - "control"
      - "Tweak.xm"
      - "AndroidBackGesture.plist"
      - "prefs/**"
      - "layout/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:

  build:

    name: Build RootHide arm64e

    runs-on: macos-14

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install \
            ldid \
            make \
            xz \
            dpkg

          echo "$(brew --prefix make)/libexec/gnubin" \
            >> "$GITHUB_PATH"


      - name: Install RootHide Theos
        run: |
          set -e

          rm -rf \
            "$GITHUB_WORKSPACE/theos"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/roothide/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" \
            >> "$GITHUB_ENV"


      - name: Install patched iOS 16.5 SDK
        run: |
          set -e

          mkdir -p \
            "$GITHUB_WORKSPACE/theos/sdks"

          rm -rf \
            "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"

          rm -rf \
            "$RUNNER_TEMP/theos-sdks"

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          cd \
            "$RUNNER_TEMP/theos-sdks"

          git sparse-checkout set \
            iPhoneOS16.5.sdk

          cp -R \
            iPhoneOS16.5.sdk \
            "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"


      - name: Verify SDK
        run: |
          set -e

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "======================================"
          echo "VERIFY SDK"
          echo "======================================"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: iPhoneOS16.5.sdk missing"
            exit 1
          fi

          echo "Found SDK:"
          echo "$SDK"

          PREFS="$SDK/System/Library/PrivateFrameworks/Preferences.framework"

          if [ ! -d "$PREFS" ]; then
            echo "ERROR: Preferences.framework missing"
            exit 1
          fi

          echo "Preferences.framework OK"


      - name: Show environment
        run: |
          set -e

          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          echo "THEOS=$THEOS"

          clang --version

          echo

          make --version

          echo

          which ldid

          echo

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -name "*.sdk" \
            -type d \
            -print


      - name: Clean
        run: |
          set -e

          echo "======================================"
          echo "CLEANING"
          echo "======================================"

          rm -rf packages
          rm -rf .theos

          make clean


      - name: Build RootHide package
        run: |
          set -e

          echo "======================================"
          echo "BUILDING"
          echo "======================================"

          make \
            package \
            FINALPACKAGE=1 \
            DEBUG=0 \
            THEOS_PACKAGE_SCHEME=roothide


      - name: Find DEB
        run: |
          set -e

          echo "======================================"
          echo "GENERATED PACKAGES"
          echo "======================================"

          find packages \
            -type f \
            -name "*.deb" \
            -print

          if ! compgen -G \
            "packages/*.deb" \
            > /dev/null; then

            echo "ERROR: No DEB generated"
            exit 1
          fi

          ls -lh \
            packages/*.deb


      - name: Verify PreferenceLoader files
        run: |
          set -e

          DEB="$(find packages \
            -type f \
            -name '*.deb' \
            | head -1)"

          echo "======================================"
          echo "VERIFY SETTINGS FILES"
          echo "======================================"

          echo "DEB:"
          echo "$DEB"

          dpkg-deb \
            -c "$DEB" \
            | tee /tmp/androidback-files.txt

          echo
          echo "Checking PreferenceLoader entry..."

          if ! grep -q \
            "PreferenceLoader/Preferences/AndroidBackGesture.plist" \
            /tmp/androidback-files.txt; then

            echo "ERROR:"
            echo "AndroidBackGesture PreferenceLoader entry missing"
            exit 1
          fi

          echo "PreferenceLoader entry OK"

          echo
          echo "Checking PreferenceBundle..."

          if ! grep -q \
            "PreferenceBundles/AndroidBackGesturePrefs.bundle" \
            /tmp/androidback-files.txt; then

            echo "ERROR:"
            echo "AndroidBackGesturePrefs.bundle missing"
            exit 1
          fi

          echo "PreferenceBundle OK"


      - name: Extract DEB for detailed verification
        run: |
          set -e

          DEB="$(find packages \
            -type f \
            -name '*.deb' \
            | head -1)"

          rm -rf \
            "$RUNNER_TEMP/androidback-deb"

          mkdir -p \
            "$RUNNER_TEMP/androidback-deb"

          dpkg-deb \
            -x "$DEB" \
            "$RUNNER_TEMP/androidback-deb"

          echo "======================================"
          echo "EXTRACTED PACKAGE"
          echo "======================================"

          find \
            "$RUNNER_TEMP/androidback-deb" \
            -type f \
            -o \
            -type l


      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBackGesture-V2.1-RootHide-arm64e
          path: packages/*.deb
          if-no-files-found: error
          compression-level: 0
