name: Build AndroidBackGesture V2 RootHide

on:
  workflow_dispatch:
  
    paths:
      - "Makefile"
      - "control"
      - "Tweak.xm"
      - "AndroidBackGesture.plist"
      - "prefs/**"
      - "layout/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build RootHide arm64e
    runs-on: macos-14

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          set -e

          brew update
          brew install ldid make xz

          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"


      - name: Install RootHide Theos
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/theos"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/roothide/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"


      - name: Install patched iOS 16.5 SDK
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"

          rm -rf \
            "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"

          rm -rf "$RUNNER_TEMP/theos-sdks"

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          cd "$RUNNER_TEMP/theos-sdks"

          git sparse-checkout set \
            iPhoneOS16.5.sdk

          cp -R \
            iPhoneOS16.5.sdk \
            "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"


      - name: Verify iOS 16.5 SDK
        run: |
          set -e

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "======================================"
          echo "CHECKING SDK"
          echo "======================================"

          test -d "$SDK"

          echo "SDK:"
          echo "$SDK"

          echo
          echo "Private frameworks:"
          ls -la "$SDK/System/Library/PrivateFrameworks" | head -50

          echo
          echo "Checking Preferences.framework..."

          if [ ! -d \
            "$SDK/System/Library/PrivateFrameworks/Preferences.framework" ]; then

            echo "ERROR:"
            echo "Preferences.framework is missing from patched SDK."
            exit 1
          fi

          echo
          echo "Preferences.framework found:"
          find \
            "$SDK/System/Library/PrivateFrameworks/Preferences.framework" \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "SDK verification OK"


      - name: Show build environment
        run: |
          set -e

          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          echo "THEOS=$THEOS"

          echo
          echo "Installed SDKs:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

          echo
          clang --version

          echo
          make --version

          echo
          which ldid
          ldid -h || true


      - name: Clean
        run: |
          set -e

          echo "======================================"
          echo "CLEANING"
          echo "======================================"

          rm -rf packages
          rm -rf .theos

          make clean


      - name: Build RootHide arm64e
        run: |
          set -e

          echo "======================================"
          echo "BUILDING"
          echo "======================================"

          make \
            package \
            FINALPACKAGE=1 \
            DEBUG=0 \
            THEOS_PACKAGE_SCHEME=roothide


      - name: Verify DEB
        run: |
          set -e

          echo "======================================"
          echo "GENERATED PACKAGE"
          echo "======================================"

          find packages \
            -type f \
            -name "*.deb" \
            -print

          if ! compgen -G "packages/*.deb" > /dev/null; then
            echo "ERROR: No .deb generated"
            exit 1
          fi

          echo
          ls -lh packages/*.deb


      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBackGesture-V2-RootHide-arm64e
          path: packages/*.deb
          if-no-files-found: error
          compression-level: 0
